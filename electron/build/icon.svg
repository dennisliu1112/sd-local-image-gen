<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Apple-style soft top-to-bottom gradient background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b7bff"/>
      <stop offset="0.55" stop-color="#7c5cfc"/>
      <stop offset="1" stop-color="#5b34e0"/>
    </linearGradient>
    <!-- subtle top sheen -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e9f2"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#3a3550"/>
      <stop offset="0.55" stop-color="#221d34"/>
      <stop offset="1" stop-color="#0e0a1c"/>
    </radialGradient>
    <radialGradient id="glass" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#9b7bff"/>
      <stop offset="0.5" stop-color="#4b3aa0"/>
      <stop offset="1" stop-color="#120e26"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#2a1170" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- rounded-square background (Apple squircle-ish) -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#sheen)"/>

  <!-- TRIPOD (behind camera) -->
  <g stroke="#efeefb" stroke-width="30" stroke-linecap="round" fill="none" opacity="0.96">
    <!-- center column -->
    <path d="M512 612 L512 706"/>
    <!-- three legs splaying down -->
    <path d="M512 700 L360 880"/>
    <path d="M512 700 L664 880"/>
    <path d="M512 700 L512 884"/>
  </g>
  <!-- leg feet -->
  <g fill="#efeefb">
    <circle cx="360" cy="884" r="17"/>
    <circle cx="664" cy="884" r="17"/>
    <circle cx="512" cy="888" r="17"/>
  </g>
  <!-- pan-tilt head -->
  <rect x="476" y="598" width="72" height="40" rx="12" fill="#d7d5e8"/>

  <!-- CAMERA (main subject, ~2/3) -->
  <g filter="url(#soft)">
    <!-- viewfinder hump -->
    <rect x="430" y="318" width="164" height="60" rx="20" fill="url(#body)"/>
    <!-- body -->
    <rect x="250" y="356" width="524" height="278" rx="58" fill="url(#body)"/>
    <!-- shutter button -->
    <rect x="300" y="330" width="78" height="34" rx="14" fill="#d7d5e8"/>
    <!-- flash window -->
    <rect x="300" y="404" width="92" height="58" rx="16" fill="#cfd8ff"/>
    <!-- lens outer -->
    <circle cx="546" cy="496" r="132" fill="#2a2540"/>
    <circle cx="546" cy="496" r="120" fill="url(#lens)"/>
    <!-- lens glass -->
    <circle cx="546" cy="496" r="84" fill="url(#glass)"/>
    <!-- glass highlight -->
    <circle cx="512" cy="462" r="26" fill="#ffffff" opacity="0.55"/>
    <circle cx="590" cy="540" r="12" fill="#b9a6ff" opacity="0.6"/>
  </g>
</svg>
