<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b7bff"/>
      <stop offset="0.55" stop-color="#7c5cfc"/>
      <stop offset="1" stop-color="#5b34e0"/>
    </linearGradient>
    <linearGradient id="bgArt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a44e8"/>
      <stop offset="1" stop-color="#42229f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round"><rect x="64" y="64" width="896" height="896" rx="208"/></clipPath>
    <clipPath id="boardClip"><rect x="132" y="150" width="344" height="372" rx="22"/></clipPath>
    <g id="cloud">
      <path d="M -86 30 C -120 30 -120 -16 -86 -18 C -90 -60 -28 -70 -6 -44
               C 6 -74 64 -70 70 -34 C 104 -36 104 30 70 30 Z"/>
    </g>
    <!-- cloud silhouettes for computing colour overlaps (Venn) -->
    <clipPath id="cA"><use href="#cloud" transform="translate(278 312) scale(1.0)"/></clipPath>
    <clipPath id="cB"><use href="#cloud" transform="translate(330 310) scale(1.0)"/></clipPath>
    <clipPath id="cC"><use href="#cloud" transform="translate(304 360) scale(1.0)"/></clipPath>
  </defs>

  <!-- background: left / right blue-purple split + Apple rounded corners -->
  <g clip-path="url(#round)">
    <rect x="64"  y="64" width="448" height="896" fill="url(#bg)"/>
    <rect x="512" y="64" width="448" height="896" fill="url(#bgArt)"/>
    <rect x="64"  y="64" width="896" height="896" fill="url(#sheen)"/>
  </g>

  <!-- ===== LEFT: canvas board (line art), enlarged toward the frame ===== -->
  <rect x="122" y="140" width="364" height="392" rx="30"
        fill="none" stroke="#ffffff" stroke-width="18"/>
  <!-- three primary-colour clouds: large, overlapping; overlaps = mixed colour -->
  <g clip-path="url(#boardClip)">
    <!-- primaries -->
    <use href="#cloud" fill="#ff4d4d" transform="translate(278 312) scale(1.0)"/>
    <use href="#cloud" fill="#ffd23d" transform="translate(330 310) scale(1.0)"/>
    <use href="#cloud" fill="#2f6bf0" transform="translate(304 360) scale(1.0)"/>
    <!-- pairwise overlaps -->
    <use href="#cloud" fill="#ff9a2e" transform="translate(278 312) scale(1.0)" clip-path="url(#cB)"/>  <!-- R∩Y = orange -->
    <use href="#cloud" fill="#27c05a" transform="translate(330 310) scale(1.0)" clip-path="url(#cC)"/>  <!-- Y∩B = green -->
    <use href="#cloud" fill="#8a3df0" transform="translate(278 312) scale(1.0)" clip-path="url(#cC)"/>  <!-- R∩B = purple -->
    <!-- triple overlap -->
    <g clip-path="url(#cC)">
      <use href="#cloud" fill="#4a3a63" transform="translate(278 312) scale(1.0)" clip-path="url(#cB)"/>
    </g>
  </g>

  <!-- ===== RIGHT: camera (line art), same size as the board ===== -->
  <g fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M690 150 h76 v46 h-76 z"/>
    <rect x="540" y="196" width="364" height="300" rx="48"/>
    <circle cx="722" cy="356" r="100"/>
    <circle cx="722" cy="356" r="50"/>
    <circle cx="592" cy="252" r="12" fill="#ffffff" stroke="none"/>
  </g>

  <!-- ===== bottom: A | G symmetric about the centre line, compact ===== -->
  <g fill="#ffffff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
     font-size="300" font-weight="800">
    <text x="488" y="880" text-anchor="end">A</text>
    <text x="536" y="880" text-anchor="start">G</text>
  </g>
</svg>
