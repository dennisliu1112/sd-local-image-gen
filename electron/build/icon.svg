<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- keep the blue-purple tone -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b7bff"/>
      <stop offset="0.55" stop-color="#7c5cfc"/>
      <stop offset="1" stop-color="#5b34e0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- deeper indigo for the art half -->
    <linearGradient id="bgArt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a44e8"/>
      <stop offset="1" stop-color="#42229f"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#3a3550"/>
      <stop offset="0.55" stop-color="#221d34"/>
      <stop offset="1" stop-color="#0e0a1c"/>
    </radialGradient>
    <radialGradient id="glass" cx="0.40" cy="0.36" r="0.72">
      <stop offset="0" stop-color="#a9b6ff"/>
      <stop offset="0.45" stop-color="#5566e6"/>
      <stop offset="1" stop-color="#120e26"/>
    </radialGradient>
    <clipPath id="round"><rect x="64" y="64" width="896" height="896" rx="208"/></clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#1c0c52" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background: two blue-purple tones split diagonally (no divider line) -->
  <g clip-path="url(#round)">
    <rect x="64" y="64" width="896" height="896" fill="url(#bg)"/>           <!-- camera half -->
    <polygon points="1120,30 1120,1120 30,1120" fill="url(#bgArt)"/>         <!-- art half (deeper) -->
    <rect x="64" y="64" width="896" height="896" fill="url(#sheen)"/>
  </g>

  <!-- ===== CAMERA SIDE: big lens, no tripod (upper-left) ===== -->
  <g filter="url(#soft)" transform="translate(372 372)">
    <circle r="212" fill="#f1f0fa"/>            <!-- lens barrel rim -->
    <circle r="196" fill="#2a2540"/>
    <circle r="176" fill="url(#lens)"/>
    <circle r="120" fill="url(#glass)"/>         <!-- glass -->
    <circle cx="-44" cy="-46" r="34" fill="#ffffff" opacity="0.6"/>  <!-- highlight -->
    <circle cx="60" cy="64" r="16" fill="#aeb9ff" opacity="0.7"/>
    <!-- shutter / aperture ticks on the rim -->
    <g fill="#cfcde2">
      <circle cx="0" cy="-188" r="9"/><circle cx="133" cy="-133" r="9"/>
      <circle cx="188" cy="0" r="9"/><circle cx="-133" cy="-133" r="9"/>
    </g>
  </g>

  <!-- ===== ART SIDE: large art board with 3-colour rainbow (lower-right) ===== -->
  <!-- board same size as the lens (~420) -->
  <g filter="url(#soft)" transform="rotate(-6 652 652)">
    <rect x="442" y="442" width="420" height="420" rx="48" fill="#f5f4fc"/>
    <rect x="442" y="442" width="420" height="420" rx="48" fill="none" stroke="#d9d7ec" stroke-width="6"/>
    <!-- three-colour rainbow (concentric arcs) -->
    <g fill="none" stroke-linecap="round" stroke-width="40">
      <path d="M 506 788 A 146 146 0 0 1 798 788" stroke="#ff5d6c"/>
      <path d="M 558 788 A 94 94 0 0 1 746 788"   stroke="#ffc233"/>
      <path d="M 610 788 A 42 42 0 0 1 694 788"   stroke="#36c5f0"/>
    </g>
  </g>

  <!-- paintbrush crossing toward the board -->
  <g filter="url(#soft)" transform="rotate(42 812 812)">
    <rect x="752" y="792" width="244" height="44" rx="22" fill="#6a4bd6"/>
    <rect x="752" y="792" width="74"  height="44" rx="22" fill="#8b6cff"/>
    <rect x="714" y="787" width="46" height="54" rx="8" fill="#c9cede"/>
    <rect x="714" y="787" width="46" height="54" rx="8" fill="none" stroke="#a7abc2" stroke-width="4"/>
    <path d="M 714 792 L 642 814 L 714 836 Z" fill="#ff5d6c"/>
    <path d="M 680 803 L 642 814 L 680 825 Z" fill="#d8324a"/>
  </g>
</svg>
