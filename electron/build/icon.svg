<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- keep the blue-purple tone -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b7bff"/>
      <stop offset="0.55" stop-color="#7c5cfc"/>
      <stop offset="1" stop-color="#5b34e0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#3a3550"/>
      <stop offset="0.55" stop-color="#221d34"/>
      <stop offset="1" stop-color="#0e0a1c"/>
    </radialGradient>
    <radialGradient id="glass" cx="0.40" cy="0.36" r="0.72">
      <stop offset="0" stop-color="#a9b6ff"/>
      <stop offset="0.45" stop-color="#5566e6"/>
      <stop offset="1" stop-color="#120e26"/>
    </radialGradient>
    <clipPath id="round"><rect x="64" y="64" width="896" height="896" rx="208"/></clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#1c0c52" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#sheen)"/>

  <!-- diagonal divider separating camera (upper-left) from art (lower-right) -->
  <g clip-path="url(#round)">
    <!-- soft tint on the art side for separation -->
    <path d="M 1024 200 L 1024 1024 L 150 1024 Z" fill="#2a1a8a" opacity="0.16"/>
    <line x1="852" y1="150" x2="180" y2="884" stroke="#ffffff" stroke-width="16"
          stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- ===== CAMERA SIDE: big lens, no tripod (upper-left) ===== -->
  <g filter="url(#soft)" transform="translate(372 372)">
    <circle r="212" fill="#f1f0fa"/>            <!-- lens barrel rim -->
    <circle r="196" fill="#2a2540"/>
    <circle r="176" fill="url(#lens)"/>
    <circle r="120" fill="url(#glass)"/>         <!-- glass -->
    <circle cx="-44" cy="-46" r="34" fill="#ffffff" opacity="0.6"/>  <!-- highlight -->
    <circle cx="60" cy="64" r="16" fill="#aeb9ff" opacity="0.7"/>
    <!-- shutter / aperture ticks on the rim -->
    <g fill="#cfcde2">
      <circle cx="0" cy="-188" r="9"/><circle cx="133" cy="-133" r="9"/>
      <circle cx="188" cy="0" r="9"/><circle cx="-133" cy="-133" r="9"/>
    </g>
  </g>

  <!-- ===== ART SIDE: colorful art board + brush (lower-right) ===== -->
  <!-- canvas board -->
  <g filter="url(#soft)" transform="rotate(-7 672 676)">
    <rect x="548" y="552" width="252" height="248" rx="30" fill="#f5f4fc"/>
    <rect x="548" y="552" width="252" height="248" rx="30" fill="none" stroke="#d9d7ec" stroke-width="6"/>
    <!-- colorful brush strokes on the board -->
    <g fill="none" stroke-linecap="round" stroke-width="24">
      <path d="M 590 614 q 84 -34 168 4" stroke="#ff5d6c"/>
      <path d="M 588 676 q 84  34 172 -2" stroke="#ffb02e"/>
      <path d="M 590 738 q 80 -30 166 2" stroke="#3ddc84"/>
    </g>
    <circle cx="772" cy="588" r="13" fill="#36c5f0"/>
  </g>

  <!-- paintbrush, large, crossing toward the board -->
  <g filter="url(#soft)" transform="rotate(42 760 760)">
    <!-- handle -->
    <rect x="700" y="742" width="232" height="40" rx="20" fill="#6a4bd6"/>
    <rect x="700" y="742" width="70"  height="40" rx="20" fill="#8b6cff"/>
    <!-- ferrule -->
    <rect x="664" y="737" width="44" height="50" rx="8" fill="#c9cede"/>
    <rect x="664" y="737" width="44" height="50" rx="8" fill="none" stroke="#a7abc2" stroke-width="4"/>
    <!-- bristle tip dipped in colour -->
    <path d="M 664 742 L 596 762 L 664 782 Z" fill="#ff5d6c"/>
    <path d="M 632 753 L 596 762 L 632 771 Z" fill="#d8324a"/>
  </g>
</svg>
