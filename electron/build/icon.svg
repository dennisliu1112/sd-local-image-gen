<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b7bff"/>
      <stop offset="0.55" stop-color="#7c5cfc"/>
      <stop offset="1" stop-color="#5b34e0"/>
    </linearGradient>
    <linearGradient id="bgArt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a44e8"/>
      <stop offset="1" stop-color="#42229f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round"><rect x="64" y="64" width="896" height="896" rx="208"/></clipPath>
    <clipPath id="boardClip"><rect x="132" y="150" width="344" height="372" rx="22"/></clipPath>
    <clipPath id="lensClip"><circle cx="722" cy="356" r="48"/></clipPath>

    <!-- three-cloud emblem: 3 petals at 120°, cloud-arc dividers -->
    <g id="trio">
      <g fill="#ff4d4d">
        <path d="M 0 0 C -36 -32 -76 -54 -94 -82 C -116 -114 -54 -134 0 -102
                 C 54 -134 116 -114 94 -82 C 76 -54 36 -32 0 0 Z"/>
      </g>
      <g fill="#ffd23d" transform="rotate(120)">
        <path d="M 0 0 C -36 -32 -76 -54 -94 -82 C -116 -114 -54 -134 0 -102
                 C 54 -134 116 -114 94 -82 C 76 -54 36 -32 0 0 Z"/>
      </g>
      <g fill="#2f6bf0" transform="rotate(240)">
        <path d="M 0 0 C -36 -32 -76 -54 -94 -82 C -116 -114 -54 -134 0 -102
                 C 54 -134 116 -114 94 -82 C 76 -54 36 -32 0 0 Z"/>
      </g>
    </g>
  </defs>

  <!-- background: left / right blue-purple split + Apple rounded corners -->
  <g clip-path="url(#round)">
    <rect x="64"  y="64" width="448" height="896" fill="url(#bg)"/>
    <rect x="512" y="64" width="448" height="896" fill="url(#bgArt)"/>
    <rect x="64"  y="64" width="896" height="896" fill="url(#sheen)"/>
  </g>

  <!-- ===== LEFT: canvas board (line art) with emblem — frame 10% smaller ===== -->
  <g transform="translate(304 336) scale(0.9) translate(-304 -336)">
    <rect x="122" y="140" width="364" height="392" rx="30" fill="none" stroke="#ffffff" stroke-width="18"/>
    <use href="#trio" transform="translate(304 338) scale(1.0)"/>
  </g>

  <!-- ===== RIGHT: camera (line art); lens shows the same emblem — frame 10% smaller ===== -->
  <g transform="translate(722 340) scale(0.9) translate(-722 -340)">
    <g fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
      <path d="M690 150 h76 v46 h-76 z"/>
      <rect x="540" y="196" width="364" height="300" rx="48"/>
      <circle cx="722" cy="356" r="100"/>
      <circle cx="722" cy="356" r="50"/>
      <circle cx="592" cy="252" r="12" fill="#ffffff" stroke="none"/>
    </g>
    <use href="#trio" transform="translate(722 356) scale(0.28)"/>
  </g>

  <!-- ===== bottom: A i G — lowercase i, same height as the caps ===== -->
  <g fill="#ffffff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800">
    <text x="470" y="880" text-anchor="end"    font-size="300">A</text>
    <text x="512" y="880" text-anchor="middle"  font-size="300">i</text>
    <text x="554" y="880" text-anchor="start"   font-size="300">G</text>
  </g>
</svg>
