<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b7bff"/>
      <stop offset="0.55" stop-color="#7c5cfc"/>
      <stop offset="1" stop-color="#5b34e0"/>
    </linearGradient>
    <linearGradient id="bgArt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a44e8"/>
      <stop offset="1" stop-color="#42229f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round"><rect x="64" y="64" width="896" height="896" rx="208"/></clipPath>
  </defs>

  <!-- background: left / right blue-purple split + Apple rounded corners -->
  <g clip-path="url(#round)">
    <rect x="64"  y="64" width="448" height="896" fill="url(#bg)"/>
    <rect x="512" y="64" width="448" height="896" fill="url(#bgArt)"/>
    <rect x="64"  y="64" width="896" height="896" fill="url(#sheen)"/>
  </g>

  <!-- ===== LEFT: easel (line art) ===== -->
  <g fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <!-- canvas board -->
    <rect x="180" y="214" width="248" height="196" rx="16"/>
    <!-- legs + back support + cross rail -->
    <path d="M242 410 L198 642"/>
    <path d="M366 410 L410 642"/>
    <path d="M304 410 L304 612"/>
    <path d="M226 300 L304 612"/>  <!-- back leg -->
    <path d="M220 520 L388 520"/>  <!-- cross rail -->
  </g>
  <!-- three-primary-colour cloud blobs on the board -->
  <g>
    <g fill="#ff4d4d"><circle cx="236" cy="312" r="17"/><circle cx="266" cy="312" r="17"/><circle cx="251" cy="296" r="22"/><circle cx="251" cy="320" r="15"/></g>
    <g fill="#ffd23d"><circle cx="316" cy="300" r="15"/><circle cx="342" cy="300" r="15"/><circle cx="329" cy="286" r="20"/><circle cx="329" cy="312" r="13"/></g>
    <g fill="#3a6ff0"><circle cx="284" cy="356" r="16"/><circle cx="312" cy="356" r="16"/><circle cx="298" cy="342" r="21"/><circle cx="298" cy="368" r="14"/></g>
  </g>

  <!-- ===== RIGHT: camera (line art) ===== -->
  <g fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <!-- viewfinder hump -->
    <path d="M676 286 h84 v34 h-84 z"/>
    <!-- body -->
    <rect x="600" y="320" width="272" height="200" rx="34"/>
    <!-- lens -->
    <circle cx="736" cy="424" r="68"/>
    <circle cx="736" cy="424" r="34"/>
    <!-- flash dot -->
    <circle cx="640" cy="362" r="9" fill="#ffffff" stroke="none"/>
  </g>

  <!-- ===== bottom: AG (white, centred) ===== -->
  <text x="512" y="836" text-anchor="middle" fill="#ffffff"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="168" font-weight="800" letter-spacing="6">AG</text>
</svg>
