<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z-Image Generator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f0f12;
    color: #e8e8ec;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    padding: 12px 20px;
    border-bottom: 1px solid #222230;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; font-weight: 600; color: #c8b8ff; }
  #status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #444; flex-shrink: 0;
    transition: background .4s;
  }
  #status-dot.ready  { background: #4caf80; }
  #status-dot.busy   { background: #f5a623; animation: pulse 1s infinite; }
  #status-dot.error  { background: #e05050; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  #status-text { font-size: 12px; color: #888; }

  /* ── Main layout ── */
  main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* ── Left: history ── */
  #history-panel {
    width: 220px;
    flex-shrink: 0;
    border-right: 1px solid #222230;
    overflow-y: auto;
    padding: 12px 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #history-panel h2 { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: .06em; padding: 0 4px 6px; }
  .hist-thumb {
    cursor: pointer;
    border-radius: 6px;
    overflow: hidden;
    border: 2px solid transparent;
    transition: border-color .2s;
  }
  .hist-thumb:hover, .hist-thumb.active { border-color: #7c5cfc; }
  .hist-thumb img { width: 100%; display: block; }
  .hist-thumb .hist-meta { font-size: 10px; color: #666; padding: 4px 6px; }
  .hist-thumb.pending .hist-meta { color: #f5a623; }
  .hist-thumb.failed  .hist-meta { color: #e05050; }

  /* ── Center: preview ── */
  #preview-panel {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }
  #preview-img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 12px;
    object-fit: contain;
    display: none;
    box-shadow: 0 8px 40px rgba(0,0,0,.6);
  }
  #preview-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    color: #333;
  }
  #preview-placeholder svg { opacity: .4; }
  #preview-placeholder p { font-size: 14px; }
  #progress-overlay {
    position: absolute;
    inset: 0;
    background: rgba(15,15,18,.85);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    border-radius: 12px;
  }
  #progress-overlay.show { display: flex; }
  #progress-bar-wrap { width: 280px; background: #222; border-radius: 99px; height: 4px; }
  #progress-bar { height: 100%; border-radius: 99px; background: #7c5cfc; transition: width .5s; width: 0%; }
  #progress-text { font-size: 13px; color: #aaa; }

  /* ── Bottom: input ── */
  #input-panel {
    flex-shrink: 0;
    border-top: 1px solid #222230;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #prompt-row { display: flex; gap: 8px; align-items: flex-end; }
  #prompt {
    flex: 1;
    background: #1a1a22;
    border: 1px solid #2e2e40;
    border-radius: 10px;
    color: #e8e8ec;
    font-size: 14px;
    padding: 10px 14px;
    resize: none;
    outline: none;
    min-height: 44px;
    max-height: 120px;
    transition: border-color .2s;
    line-height: 1.5;
  }
  #prompt:focus { border-color: #7c5cfc; }
  #prompt::placeholder { color: #444; }
  #negative {
    flex: 1;
    background: #1a1a22;
    border: 1px solid #2e2e40;
    border-radius: 8px;
    color: #888;
    font-size: 12px;
    padding: 7px 12px;
    resize: none;
    outline: none;
    height: 32px;
    transition: border-color .2s;
  }
  #negative:focus { border-color: #555; }
  #negative::placeholder { color: #383848; }

  #controls-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .ctrl-label { font-size: 11px; color: #555; }
  select, input[type=number], input[type=range] {
    background: #1a1a22;
    border: 1px solid #2e2e40;
    color: #ccc;
    border-radius: 6px;
    font-size: 12px;
    padding: 4px 8px;
    outline: none;
  }
  select { cursor: pointer; }
  input[type=number] { width: 70px; }
  input[type=range] { width: 80px; accent-color: #7c5cfc; }
  .ctrl-val { font-size: 12px; color: #888; min-width: 24px; }

  #gen-btn {
    margin-left: auto;
    background: #7c5cfc;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 24px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s, opacity .2s;
    white-space: nowrap;
  }
  #gen-btn:hover:not(:disabled) { background: #9474ff; }
  #gen-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2e2e40; border-radius: 99px; }
</style>
</head>
<body>

<header>
  <div id="status-dot"></div>
  <h1>Z-Image Generator</h1>
  <span id="status-text">連線中…</span>
</header>

<main>
  <!-- Left: history -->
  <div id="history-panel">
    <h2>歷史記錄</h2>
    <div id="history-list"></div>
  </div>

  <!-- Center: preview -->
  <div id="preview-panel">
    <div id="preview-placeholder">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="m21 15-5-5L5 21"/>
      </svg>
      <p>輸入描述後點擊生成</p>
    </div>
    <img id="preview-img" alt="生成結果">
    <div id="progress-overlay">
      <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
      <div id="progress-text">準備中…</div>
    </div>
  </div>
</main>

<!-- Bottom: input -->
<div id="input-panel">
  <div id="prompt-row">
    <textarea id="prompt" placeholder="描述你想生成的圖片，例如：a girl standing on a beach at sunset, photorealistic" rows="2"></textarea>
    <button id="gen-btn" onclick="generate()">生成</button>
  </div>
  <div style="display:flex; gap:8px; align-items:center;">
    <span class="ctrl-label">負面描述</span>
    <textarea id="negative" placeholder="不想要的內容，例如：blurry, bad anatomy（可留空）"></textarea>
  </div>
  <div id="controls-row">
    <span class="ctrl-label">解析度</span>
    <select id="resolution">
      <option value="512,512">512 × 512（~1 分）</option>
      <option value="768,768">768 × 768（~3 分）</option>
      <option value="1024,1024" selected>1024 × 1024（~5 分）</option>
      <option value="1216,1216">1216 × 1216（~8 分）</option>
      <option value="1024,1280">1024 × 1280 縱向（~7 分）</option>
      <option value="1280,1024">1280 × 1024 橫向（~7 分）</option>
    </select>

    <span class="ctrl-label" style="margin-left:8px">Steps</span>
    <input type="range" id="steps" min="1" max="20" value="4" oninput="document.getElementById('steps-val').textContent=this.value">
    <span class="ctrl-val" id="steps-val">4</span>

    <span class="ctrl-label" style="margin-left:8px">Seed</span>
    <input type="number" id="seed" value="-1" min="-1" max="4294967295" title="-1 表示隨機">

    <button onclick="document.getElementById('seed').value=Math.floor(Math.random()*2**32)" style="background:#1a1a22;border:1px solid #2e2e40;color:#888;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:12px">🎲</button>
  </div>
</div>

<script>
const API = '';   // same origin
let currentJobId = null;
let pollTimer = null;
let genStartTime = null;

// ── Status polling ─────────────────────────────────────────────────────────
async function checkReady() {
  try {
    const r = await fetch(`${API}/health`);
    const d = await r.json();
    const dot  = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    if (d.sd_server_ready) {
      dot.className  = 'ready';
      text.textContent = '就緒';
      document.getElementById('gen-btn').disabled = false;
    } else {
      dot.className  = '';
      text.textContent = '模型載入中…';
      document.getElementById('gen-btn').disabled = true;
      setTimeout(checkReady, 3000);
    }
  } catch {
    const dot = document.getElementById('status-dot');
    dot.className = 'error';
    document.getElementById('status-text').textContent = '無法連線';
    setTimeout(checkReady, 5000);
  }
}

// ── Generate ───────────────────────────────────────────────────────────────
async function generate() {
  const prompt = document.getElementById('prompt').value.trim();
  if (!prompt) { document.getElementById('prompt').focus(); return; }

  const [w, h] = document.getElementById('resolution').value.split(',').map(Number);
  const steps  = parseInt(document.getElementById('steps').value);
  const seed   = parseInt(document.getElementById('seed').value);
  const neg    = document.getElementById('negative').value.trim();

  setGenerating(true, w, h);

  try {
    const r = await fetch(`${API}/generate`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ prompt, negative_prompt: neg, width: w, height: h, steps, cfg_scale: 1.0, seed })
    });
    if (!r.ok) {
      const err = await r.json();
      throw new Error(err.detail || r.statusText);
    }
    const job = await r.json();
    currentJobId = job.job_id;
    addHistoryItem(job);
    pollJob(job.job_id, w, h);
  } catch (e) {
    setGenerating(false);
    alert('生成失敗：' + e.message);
  }
}

// ── Poll job ───────────────────────────────────────────────────────────────
function pollJob(jobId, w, h) {
  pollTimer = setInterval(async () => {
    try {
      const r = await fetch(`${API}/jobs/${jobId}`);
      const job = await r.json();
      updateProgress(job, w, h);
      updateHistoryItem(job);

      if (job.status === 'done') {
        clearInterval(pollTimer);
        showImage(jobId, job.duration_seconds);
        setGenerating(false);
      } else if (job.status === 'failed') {
        clearInterval(pollTimer);
        setGenerating(false);
        alert('生成失敗：' + (job.error || '未知錯誤'));
      }
    } catch { /* network hiccup, keep polling */ }
  }, 2000);
}

// ── Progress ───────────────────────────────────────────────────────────────
function setGenerating(busy, w, h) {
  document.getElementById('gen-btn').disabled = busy;
  const dot  = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  const overlay = document.getElementById('progress-overlay');

  if (busy) {
    dot.className = 'busy';
    text.textContent = '生成中…';
    overlay.classList.add('show');
    genStartTime = Date.now();
    document.getElementById('progress-bar').style.width = '0%';
    updateProgressText(w, h);
  } else {
    dot.className = 'ready';
    text.textContent = '就緒';
    overlay.classList.remove('show');
    clearInterval(pollTimer);
  }
}

function updateProgress(job, w, h) {
  if (job.status !== 'running') return;
  const elapsed = (Date.now() - genStartTime) / 1000;
  const estimate = estimateSecs(w, h);
  const pct = Math.min(95, (elapsed / estimate) * 100);
  document.getElementById('progress-bar').style.width = pct + '%';
  updateProgressText(w, h, elapsed);
}

function updateProgressText(w, h, elapsed) {
  const estimate = estimateSecs(w, h);
  const left = elapsed ? Math.max(0, estimate - elapsed) : estimate;
  const fmt = s => s >= 60 ? `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}` : `${Math.round(s)}s`;
  document.getElementById('progress-text').textContent =
    elapsed ? `已用 ${fmt(elapsed)} · 預估剩餘 ${fmt(left)}` : `預估約 ${fmt(estimate)}`;
}

function estimateSecs(w, h) {
  // t ≈ 57 × (pixels / 512²)^1.26  (measured on Apple M5)
  const base = 57, basePx = 512 * 512;
  return base * Math.pow((w * h) / basePx, 1.26);
}

// ── Show result ────────────────────────────────────────────────────────────
function showImage(jobId, duration) {
  const img = document.getElementById('preview-img');
  const ph  = document.getElementById('preview-placeholder');
  img.src = `${API}/images/${jobId}?t=${Date.now()}`;
  img.style.display = 'block';
  ph.style.display  = 'none';
  img.onload = () => {
    document.getElementById('progress-bar').style.width = '100%';
  };
  document.getElementById('status-text').textContent =
    duration ? `完成 (${duration}s)` : '完成';
}

// ── History ────────────────────────────────────────────────────────────────
function addHistoryItem(job) {
  const list = document.getElementById('history-list');
  const el = document.createElement('div');
  el.className = 'hist-thumb pending';
  el.id = 'hist-' + job.job_id;
  el.innerHTML = `
    <div class="hist-meta">${job.prompt.slice(0,30)}…</div>
  `;
  el.onclick = () => {
    if (job.status === 'done') showImage(job.job_id, job.duration_seconds);
  };
  list.prepend(el);
}

function updateHistoryItem(job) {
  const el = document.getElementById('hist-' + job.job_id);
  if (!el) return;
  el.className = 'hist-thumb ' + job.status;
  if (job.status === 'done') {
    el.innerHTML = `
      <img src="${API}/images/${job.job_id}?t=${Date.now()}" loading="lazy">
      <div class="hist-meta">${job.duration_seconds}s · ${job.width}×${job.height}</div>
    `;
    el.onclick = () => showImage(job.job_id, job.duration_seconds);
  } else if (job.status === 'failed') {
    el.innerHTML = `<div class="hist-meta">失敗</div>`;
  }
}

// ── Prompt Enter key ───────────────────────────────────────────────────────
document.getElementById('prompt').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); generate(); }
});

// ── Init ───────────────────────────────────────────────────────────────────
checkReady();
document.getElementById('gen-btn').disabled = true;
</script>
</body>
</html>
