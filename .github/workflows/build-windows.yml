name: Build Windows MSI

on:
  push:
    branches: [master]
    paths:
      - 'windows-app/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get latest stable-diffusion.cpp release
        id: sd_release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          RELEASE=$(curl -sH "Authorization: token $GITHUB_TOKEN" \
            https://api.github.com/repos/leejet/stable-diffusion.cpp/releases/latest)
          TAG=$(echo "$RELEASE" | python -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          URL=$(echo "$RELEASE" | python -c "
          import sys,json
          d=json.load(sys.stdin)
          for a in d['assets']:
            n=a['name']
            if 'win' in n and 'vulkan' in n and 'x64' in n and n.endswith('.zip'):
              print(a['browser_download_url']); exit()
          for a in d['assets']:
            n=a['name']
            if 'win' in n and 'avx2' in n and 'x64' in n and n.endswith('.zip'):
              print(a['browser_download_url']); exit()
          print('')
          ")
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "url=$URL"  >> $GITHUB_OUTPUT
          echo "Release: $TAG  URL: $URL"

      - name: Download sd-server Vulkan binary
        shell: bash
        run: |
          curl -L "${{ steps.sd_release.outputs.url }}" -o sd_release.zip
          unzip -j sd_release.zip "*.exe" "*.dll" -d sd_bin/

      - name: Assemble dist folder
        shell: bash
        run: |
          mkdir -p dist/static dist/models dist/output dist/logs
          cp windows-app/server.py         dist/
          cp windows-app/requirements.txt  dist/
          cp windows-app/static/index.html dist/static/
          sed 's/$/\r/' windows-app/start.bat           > dist/start.bat
          sed 's/$/\r/' windows-app/download_models.bat > dist/download_models.bat
          cp sd_bin/*.exe dist/ 2>/dev/null || true
          cp sd_bin/*.dll dist/ 2>/dev/null || true
          cat > dist/README.txt << 'EOF'
          Z-Image Generator
          1. Double-click the Start Menu / Desktop shortcut, or run start.bat
          2. Browser opens at http://localhost:8080
          3. First launch: enter your model folder, or run download_models.bat
          EOF

      - name: Bundle Python dependencies
        shell: cmd
        run: python -m pip install --quiet -r dist\requirements.txt --target dist\lib

      - name: Install WiX v4
        shell: cmd
        run: |
          dotnet tool install --global wix
          wix extension add WixToolset.UI.wixext/4.*

      - name: Create license.rtf
        shell: bash
        run: printf '{\\rtf1\\ansi MIT License. Free to use.}' > windows-app/license.rtf

      - name: Build MSI
        shell: cmd
        run: |
          wix build windows-app\setup.wxs ^
            -dDistDir=dist ^
            -ext WixToolset.UI.wixext ^
            -arch x64 ^
            -o ZImageGen_Setup.msi
          dir ZImageGen_Setup.msi

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: ZImageGen-MSI-${{ steps.sd_release.outputs.tag }}
          path: ZImageGen_Setup.msi
          retention-days: 30
