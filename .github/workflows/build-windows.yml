name: Build Windows App (Electron)

# Produces an NSIS installer (~250 MB). Two ways to trigger:
#   • Manually from the Actions tab ("Run workflow") → build only, uploaded as a
#     7-day artifact for testing. Does NOT publish a Release.
#   • Push a version tag (e.g. `git tag v1.1.0 && git push --tags`) → build AND
#     publish the installer to GitHub Releases, where colleagues can download it
#     without a login (the repo is public).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Needed so the workflow can create/update a GitHub Release on tag push.
permissions:
  contents: write

env:
  # Embeddable CPython version bundled with the app. python.exe is signed by
  # the Python Software Foundation, so antivirus leaves it alone — unlike the
  # old PyInstaller-packed server.exe, which kept getting quarantined.
  PY_EMBED_VERSION: '3.12.7'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- Python backend → embedded CPython runtime -----------------------
      # No PyInstaller. We download the official Windows embeddable package,
      # enable site-packages, bootstrap pip, then install the backend deps into
      # it. The result (runtime/) is bundled as-is and run via `python.exe
      # server.py` — no packer, no exe to trip antivirus heuristics.
      - name: Build embedded Python runtime
        shell: pwsh
        run: |
          $ver = "${{ env.PY_EMBED_VERSION }}"
          $url = "https://www.python.org/ftp/python/$ver/python-$ver-embed-amd64.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile pyembed.zip
          Expand-Archive -Path pyembed.zip -DestinationPath runtime -Force

          # Enable site-packages: uncomment the `import site` line so pip-installed
          # packages under Lib\site-packages are importable.
          $pth = Get-ChildItem runtime -Filter "python*._pth" | Select-Object -First 1
          (Get-Content $pth.FullName) `
            -replace '^\s*#\s*import site', 'import site' `
            | Set-Content $pth.FullName

          # Bootstrap pip into the embeddable runtime.
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile get-pip.py
          runtime\python.exe get-pip.py --no-warn-script-location

          # Install backend deps into the embedded runtime.
          runtime\python.exe -m pip install --no-warn-script-location -r windows-app\requirements.txt

          # Trim build-time cruft to keep the bundle lean.
          Remove-Item runtime\get-pip.py -ErrorAction SilentlyContinue
          Get-ChildItem runtime -Recurse -Directory -Filter "__pycache__" |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "Smoke test — import the backend's deps:"
          runtime\python.exe -c "import fastapi, uvicorn, httpx, PIL; print('deps OK')"

      # Engines + models are NOT bundled — the app downloads them on first run
      # (keeps this artifact small, ~250 MB instead of multiple GB).

      # --- Electron shell → electron-builder NSIS installer ----------------
      - name: Install Electron deps
        shell: cmd
        working-directory: electron
        run: npm ci

      - name: Build Electron app (Windows NSIS installer)
        shell: cmd
        working-directory: electron
        # --publish never: electron-builder builds only. Publishing to Releases
        # is handled explicitly by the softprops step below, so we don't want
        # electron-builder to auto-publish (which it may try to do on a tag).
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Stage installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item electron/release/*.exe out/ -ErrorAction SilentlyContinue
          Get-ChildItem out

      # Always upload as a build artifact (handy for testing a workflow_dispatch
      # build without cutting a Release). Expires after 7 days, login required.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmazingImageGenerator-Windows-Setup-${{ github.run_number }}
          path: out/*.exe
          retention-days: 7

      # On a version-tag push, publish the installer to GitHub Releases so
      # colleagues can download it directly (no login on a public repo). The
      # release is created from the pushed tag if it doesn't already exist.
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
