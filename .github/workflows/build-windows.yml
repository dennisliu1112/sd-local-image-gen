name: Build Windows App (Electron)

# Manual only — each run produces a ~1 GB artifact, so don't build on every
# push. Trigger from the Actions tab ("Run workflow") when you want a new
# Windows build.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- Python backend → PyInstaller onedir -----------------------------
      - name: Install Python deps + PyInstaller
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows-app\requirements.txt pyinstaller

      - name: Build backend (PyInstaller onedir)
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean ^
            --distpath server_dist --workpath build_pyi ^
            --name server --onedir --console ^
            --add-data "%CD%\windows-app\static;static" ^
            --collect-all uvicorn ^
            --collect-all PIL ^
            windows-app\server.py
          dir server_dist\server

      # Engines are NOT bundled — the app downloads them on first run
      # (keeps this artifact small, ~250 MB instead of ~1 GB).

      # --- Electron shell → electron-builder win zip -----------------------
      - name: Install Electron deps
        shell: cmd
        working-directory: electron
        run: npm ci

      - name: Build Electron app (Windows zip)
        shell: cmd
        working-directory: electron
        run: npx electron-builder --win zip --x64

      - name: Stage release + README
        shell: bash
        run: |
          mkdir -p out
          cp electron/release/*.zip "out/" 2>/dev/null || true
          ls -lh out/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AmazingImageGenerator-Windows-${{ github.run_number }}
          path: out/*.zip
          retention-days: 7
