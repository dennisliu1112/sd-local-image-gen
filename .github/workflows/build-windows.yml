name: Build Windows Installer

on:
  push:
    branches: [master]
    paths:
      - 'windows-app/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get latest stable-diffusion.cpp release info
        id: sd_release
        shell: bash
        run: |
          RELEASE=$(curl -s https://api.github.com/repos/leejet/stable-diffusion.cpp/releases/latest)
          TAG=$(echo "$RELEASE" | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          URL=$(echo "$RELEASE" | python3 -c "
          import sys,json
          d = json.load(sys.stdin)
          for a in d['assets']:
            n = a['name']
            if 'win' in n and 'vulkan' in n and 'x64' in n and n.endswith('.zip'):
              print(a['browser_download_url']); exit()
          for a in d['assets']:
            n = a['name']
            if 'win' in n and 'avx2' in n and 'x64' in n and n.endswith('.zip'):
              print(a['browser_download_url']); exit()
          print('')
          ")
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "url=$URL"  >> $GITHUB_OUTPUT
          echo "Found: $TAG"

      - name: Download sd-server binary
        shell: bash
        run: |
          URL="${{ steps.sd_release.outputs.url }}"
          curl -L "$URL" -o sd_release.zip
          unzip -j sd_release.zip "*.exe" "*.dll" -d sd_bin/ || true
          ls sd_bin/

      - name: Assemble dist folder
        shell: bash
        run: |
          mkdir -p dist/static dist/models dist/output dist/logs

          cp windows-app/server.py          dist/
          cp windows-app/requirements.txt   dist/
          cp windows-app/static/index.html  dist/static/

          # bat files: convert LF -> CRLF
          sed 's/$/\r/' windows-app/start.bat           > dist/start.bat
          sed 's/$/\r/' windows-app/download_models.bat > dist/download_models.bat

          # sd-server binary + DLLs
          cp sd_bin/*.exe dist/ 2>/dev/null || true
          cp sd_bin/*.dll dist/ 2>/dev/null || true

          # README
          cat > dist/README.txt << 'EOF'
          Z-Image Generator
          =================
          First time:
            1. Run download_models.bat  (downloads ~6.3 GB, one-time only)
               OR copy existing models into the folder you chose during install.
            2. Run start.bat
            3. Browser opens at http://localhost:8080

          If models are already on your PC, just point to that folder
          in the setup screen that appears on first launch.
          EOF

          echo "dist contents:"
          ls -lh dist/

      - name: Install Python dependencies into dist
        shell: cmd
        run: |
          python -m pip install -q -r dist\requirements.txt --target dist\lib
          echo Done

      - name: Update start.bat to use bundled libs
        shell: bash
        run: |
          # Prepend PYTHONPATH so bundled libs in dist/lib are found
          sed -i 's|"%PYTHON%" "%~dp0server.py"|set "PYTHONPATH=%~dp0lib" \& "%PYTHON%" "%~dp0server.py"|' dist/start.bat || true

      - name: Install Inno Setup
        shell: cmd
        run: choco install innosetup -y --no-progress

      - name: Build MSI-style installer
        shell: cmd
        run: |
          copy windows-app\setup.iss setup.iss
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss
          dir installer_out\

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ZImageGen-Installer-${{ steps.sd_release.outputs.tag }}
          path: installer_out\ZImageGen_Setup_*.exe
          retention-days: 30
