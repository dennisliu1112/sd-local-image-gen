name: Build Windows App

on:
  push:
    branches: [master]
    paths:
      - 'windows-app/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Get latest stable-diffusion.cpp release
        id: sd_release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          RELEASE=$(curl -sH "Authorization: token $GITHUB_TOKEN" \
            https://api.github.com/repos/leejet/stable-diffusion.cpp/releases/latest)
          TAG=$(echo "$RELEASE" | python -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          pick() {
            echo "$RELEASE" | python -c "
          import sys,json
          kw='$1'
          for a in json.load(sys.stdin)['assets']:
            n=a['name'].lower()
            if 'win' in n and kw in n and 'x64' in n and n.endswith('.zip'):
              print(a['browser_download_url']); break
          "
          }
          echo "tag=$TAG"            >> $GITHUB_OUTPUT
          echo "vurl=$(pick vulkan)" >> $GITHUB_OUTPUT
          echo "curl=$(pick avx2)"   >> $GITHUB_OUTPUT

      - name: Download both engines (Vulkan + CPU)
        shell: bash
        run: |
          curl -L "${{ steps.sd_release.outputs.vurl }}" -o vulkan.zip
          curl -L "${{ steps.sd_release.outputs.curl }}" -o cpu.zip
          unzip -j vulkan.zip "*.exe" "*.dll" -d engine-vulkan/
          unzip -j cpu.zip    "*.exe" "*.dll" -d engine-cpu/
          ls engine-vulkan/ engine-cpu/

      - name: Install Python deps + PyInstaller
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows-app\requirements.txt pyinstaller

      - name: Build single-exe app (PyInstaller, no console)
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean ^
            --name ZImageGen ^
            --windowed ^
            --add-data "windows-app/static;static" ^
            --collect-all webview ^
            windows-app\server.py
          dir dist\ZImageGen

      - name: Assemble distribution folder
        shell: bash
        run: |
          APP=dist/ZImageGen
          mkdir -p "$APP/engine-vulkan" "$APP/engine-cpu" "$APP/models"
          cp engine-vulkan/* "$APP/engine-vulkan/" 2>/dev/null || true
          cp engine-cpu/*    "$APP/engine-cpu/"    2>/dev/null || true
          cat > "$APP/README.txt" << 'EOF'
          Z-Image Generator
          =================
          Double-click ZImageGen.exe — no install, no admin needed.

          IMPORTANT: keep this folder in an English-only path (e.g. C:\ZImageGen).
          Avoid Chinese folders, Desktop (桌面), or OneDrive.

          First launch: a setup screen lets you pick your model folder, or
          download the models (~6.3 GB). Closing the window stops everything.
          EOF
          ls -la "$APP"

      - name: Zip
        shell: bash
        run: |
          TAG="${{ steps.sd_release.outputs.tag }}"
          cd dist
          7z a -tzip "../ZImageGen_Windows_${TAG}.zip" ZImageGen >/dev/null
          cd ..
          ls -lh ZImageGen_Windows_*.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ZImageGen-Windows-${{ steps.sd_release.outputs.tag }}
          path: ZImageGen_Windows_*.zip
          retention-days: 30
