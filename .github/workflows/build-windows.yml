name: Build Windows App (Electron)

on:
  push:
    branches: [master]
    paths:
      - 'windows-app/**'
      - 'electron/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- Python backend → PyInstaller onedir -----------------------------
      - name: Install Python deps + PyInstaller
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows-app\requirements.txt pyinstaller

      - name: Build backend (PyInstaller onedir)
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean ^
            --distpath server_dist --workpath build_pyi --specpath build_pyi ^
            --name server --onedir --console ^
            --add-data "windows-app/static;static" ^
            --collect-all uvicorn ^
            windows-app\server.py
          dir server_dist\server

      # --- Bundle both sd-server engines next to the backend ---------------
      - name: Get latest stable-diffusion.cpp release
        id: sd_release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          RELEASE=$(curl -sH "Authorization: token $GITHUB_TOKEN" \
            https://api.github.com/repos/leejet/stable-diffusion.cpp/releases/latest)
          TAG=$(echo "$RELEASE" | python -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          pick() {
            echo "$RELEASE" | python -c "
          import sys,json
          kw='$1'
          for a in json.load(sys.stdin)['assets']:
            n=a['name'].lower()
            if 'win' in n and kw in n and 'x64' in n and n.endswith('.zip'):
              print(a['browser_download_url']); break
          "
          }
          echo "tag=$TAG"            >> $GITHUB_OUTPUT
          echo "vurl=$(pick vulkan)" >> $GITHUB_OUTPUT
          echo "curl=$(pick avx2)"   >> $GITHUB_OUTPUT

      - name: Download + place engines
        shell: bash
        run: |
          curl -L "${{ steps.sd_release.outputs.vurl }}" -o vulkan.zip
          curl -L "${{ steps.sd_release.outputs.curl }}" -o cpu.zip
          unzip -j vulkan.zip "*.exe" "*.dll" -d server_dist/server/engine-vulkan/
          unzip -j cpu.zip    "*.exe" "*.dll" -d server_dist/server/engine-cpu/
          ls server_dist/server/engine-vulkan/ server_dist/server/engine-cpu/

      # --- Electron shell → electron-builder win zip -----------------------
      - name: Install Electron deps
        shell: cmd
        working-directory: electron
        run: npm ci

      - name: Build Electron app (Windows zip)
        shell: cmd
        working-directory: electron
        run: npx electron-builder --win zip --x64

      - name: Stage release + README
        shell: bash
        run: |
          mkdir -p out
          cp electron/release/*.zip "out/" 2>/dev/null || true
          ls -lh out/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ZImageGen-Windows-${{ steps.sd_release.outputs.tag }}
          path: out/*.zip
          retention-days: 30
