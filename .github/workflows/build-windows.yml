name: Build Windows Portable

on:
  push:
    branches: [master]
    paths:
      - 'windows-app/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get latest stable-diffusion.cpp release
        id: sd_release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          RELEASE=$(curl -sH "Authorization: token $GITHUB_TOKEN" \
            https://api.github.com/repos/leejet/stable-diffusion.cpp/releases/latest)
          TAG=$(echo "$RELEASE" | python -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          URL=$(echo "$RELEASE" | python -c "
          import sys,json
          d=json.load(sys.stdin)
          for a in d['assets']:
            n=a['name']
            if 'win' in n and 'vulkan' in n and 'x64' in n and n.endswith('.zip'):
              print(a['browser_download_url']); exit()
          for a in d['assets']:
            n=a['name']
            if 'win' in n and 'avx2' in n and 'x64' in n and n.endswith('.zip'):
              print(a['browser_download_url']); exit()
          print('')
          ")
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "url=$URL"  >> $GITHUB_OUTPUT
          echo "Release: $TAG"

      - name: Download sd-server Vulkan binary
        shell: bash
        run: |
          curl -L "${{ steps.sd_release.outputs.url }}" -o sd_release.zip
          unzip -j sd_release.zip "*.exe" "*.dll" -d sd_bin/
          ls sd_bin/

      - name: Assemble portable folder
        shell: bash
        run: |
          mkdir -p dist/static dist/output dist/logs
          cp windows-app/server.py         dist/
          cp windows-app/requirements.txt  dist/
          cp windows-app/static/index.html dist/static/
          sed 's/$/\r/' windows-app/start.bat           > dist/start.bat
          sed 's/$/\r/' windows-app/download_models.bat > dist/download_models.bat
          cp sd_bin/*.exe dist/ 2>/dev/null || true
          cp sd_bin/*.dll dist/ 2>/dev/null || true
          cat > dist/README.txt << 'EOF'
          Z-Image Generator (Portable)
          ============================
          No installation needed. No admin rights needed.

          1. Run start.bat  (double-click)
          2. Browser opens at http://localhost:8080
          3. On first launch, enter your model folder path in the setup screen,
             OR run download_models.bat to download the ~6.3 GB models.

          To move/copy this app: just move the whole folder.
          EOF

      - name: Bundle embeddable Python + dependencies
        shell: bash
        run: |
          PY_VER=3.12.9
          curl -L "https://www.python.org/ftp/python/${PY_VER}/python-${PY_VER}-embed-amd64.zip" -o py_embed.zip
          mkdir -p dist/python
          unzip -q py_embed.zip -d dist/python

          # Enable site-packages so pip-installed deps are importable
          PTH=$(ls dist/python/python*._pth)
          printf 'python312.zip\r\n.\r\nLib\\site-packages\r\nimport site\r\n' > "$PTH"

          # Bootstrap pip, then install runtime deps into the embeddable python
          curl -L https://bootstrap.pypa.io/get-pip.py -o get-pip.py
          dist/python/python.exe get-pip.py --no-warn-script-location
          dist/python/python.exe -m pip install --no-warn-script-location -r dist/requirements.txt

          echo "Bundled Python contents:"
          ls dist/python

      - name: Create ZIP
        shell: bash
        run: |
          TAG="${{ steps.sd_release.outputs.tag }}"
          cd dist
          7z a -tzip "../ZImageGen_Portable_${TAG}.zip" . >/dev/null
          cd ..
          ls -lh ZImageGen_Portable_*.zip

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ZImageGen-Portable-${{ steps.sd_release.outputs.tag }}
          path: ZImageGen_Portable_*.zip
          retention-days: 30
